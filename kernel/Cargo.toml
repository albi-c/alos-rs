[package]
name = "alos"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["macros"]

[target.x86_64-unknown-none]
rustflags = ["-C", "target-feature=-mmx", "-C", "target-feature=-sse"]

[profile.dev]
opt-level = 1

[features]
default = ["smp"]
smp = []

[dependencies]
macros = { path = "macros" }
limine = "0.4"
spin = "0.10.0"
paste = "1.0.15"
acpi = "6.0.1"
