[package]
name = "alos"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["macros"]

[target.x86_64-unknown-none]
rustflags = ["-C", "target-feature=-mmx", "-C", "target-feature=-sse", "-C", "force-unwind-tables", "-C", "force-frame-pointers"]

[profile.dev]
opt-level = 0

[features]
default = []
smp = []

[dependencies]
macros = { path = "macros" }
backtracer_core = "0.0.7"
limine = "0.5.0"
spin = "0.12.3"
paste = "1.0.15"
acpi = { version = "6.0.1", default-features = false, features = ["aml"] }
elf = { version = "0.8.0", default-features = false, features = [] }
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics", "const_zeroed"] }
modular-bitfield = "0.13.1"
bitflags = { version = "2.13.2", features = ["bytemuck"] }
gimli = { version = "0.34.0", default-features = false, features = ["read"] }
compact_str = { version = "0.10.0", default-features = false, features = [] }
uuid = { version = "1.28.0", default-features = false, features = [] }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_128"] }
